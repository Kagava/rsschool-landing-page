<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .wrapper {
        max-width: 1440px;
        margin: auto;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e1d4c9;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="wrapperr"></div>
    </header>
    <main class="main">
      <div class="wrapper">
        <div class="hero">
          <div
            class="hero__container"
            style="background-image: url(imgs/hero/img-hero.jpg)"
          >
            <div class="hero__offer">
              <h1 class="hero__header">
                <span>Enjoy</span> premium coffee at our charming cafe
              </h1>
              <p class="hero__info">
                With its inviting atmosphere and delicious coffee options, the
                Coffee House Resource is a popular destination for coffee lovers
                and those seeking a warm and inviting space to enjoy their
                favorite beverage.
              </p>
              <a href="#" class="hero__link"><span>Menu</span></a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="wrapper"></div>
    </footer>
  </body>
</html>
