<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/build/menu/menu.css" />
    <link
      type="imaga/x-icon"
      href="./imgs/favicon/fav-icon.png"
      rel="shortcut icon"
    />
    <link type="imaga/x-icon" href="./imgs/favicon/fav-icon.png" rel="icon" />
    <title>Coffe Menu</title>
  </head>
  <body>
    <header class="header">
      <div class="wrapper">
        <div class="header__container">
          <div class="header__logo">
            <a href="index.html" class="logo__link"></a>
          </div>
          <div class="header__navigation-container">
            <nav class="header__navigation">
              <ul class="header__navigation-list">
                <li class="header__navigation-item">
                  <a href="index.html#favorite" class="header__navigation-link"
                    >Favorite coffee</a
                  >
                </li>
                <li class="header__navigation-item">
                  <a href="index.html#about" class="header__navigation-link"
                    >About</a
                  >
                </li>
                <li class="header__navigation-item">
                  <a href="index.html#app" class="header__navigation-link"
                    >Mobile app</a
                  >
                </li>
                <li class="header__navigation-item">
                  <a href="index.html#footer" class="header__navigation-link"
                    >Contact us</a
                  >
                </li>
              </ul>
            </nav>
          </div>
          <div class="header__menu-settings">
            <div class="headaer__settings">
              <div class="header__themes">
                <label
                  for="theme-light"
                  class="radio-light header__radio-label"
                >
                  <input type="radio" name="shema" id="theme-light" checked />
                </label>
                <label for="theme-dark" class="radio-dark header__radio-label">
                  <input type="radio" name="shema" id="theme-dark" />
                </label>
              </div>
            </div>
            <div class="header__menu-link-container">
              <a href="menu.html" class="header__menu-link">Menu</a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="main">
      <div class="wrapper">
        <div class="main__container">
          <div class="main-heading__container">
            <h2 class="main__heading">
              Behind each of our cups hides an <span>amazing surprise</span>
            </h2>
            <div class="main__tags">
              <div class="main__tag coffee"></div>
              <div class="main__tag tea"></div>
              <div class="main__tag desert"></div>
            </div>
          </div>
          <div class="main__menu-container"><!-- Карточки---></div>
        </div>
      </div>
    </main>
    <footer class="footer" id="footer">
      <div class="wrapper">
        <div class="footer__container">
          <div class="footer__info">
            <h2 class="footer__heading">
              Sip, Savor, Smile. <span>It’s coffee time!</span>
            </h2>
            <div class="footer__media">
              <div class="footer__link tw"></div>
              <div class="footer__link face"></div>
              <div class="footer__link inst"></div>
            </div>
          </div>
          <div class="footer__contact">
            <h3 class="contact__heading">Contact us</h3>
            <div class="contact__info">
              <a
                href="https://www.google.com/maps/place/%D0%9B%D0%BE%D1%81-%D0%90%D0%BD%D0%B4%D0%B6%D0%B5%D0%BB%D0%B5%D1%81,+%D0%9A%D0%B0%D0%BB%D0%B8%D1%84%D0%BE%D1%80%D0%BD%D0%B8%D1%8F,+%D0%A1%D0%A8%D0%90/@34.0200374,-118.742062,10z/data=!3m1!4b1!4m10!1m2!2m1!1s8558+Green+Rd+Los+angeles!3m6!1s0x80c2c75ddc27da13:0xe22fdf6f254608f4!8m2!3d34.0549076!4d-118.242643!15sChk4NTU4IEdyZWVuIFJkIExvcyBhbmdlbGVzkgEIbG9jYWxpdHngAQA!16s%2Fm%2F030qb3t?entry=ttu&g_ep=EgoyMDI2MDkxNC4wIKXMDSoASAFQAw%3D%3D"
                class="contact__place contact__item"
                target="_blank"
                >8558 Green Rd., LA</a
              >
              <a
                href="tel:+1(603)555-0123"
                class="contact__phone contact__item"
                target="_blank"
                >+1(603)555-0123</a
              >
              <div class="contact__time contact__item">Mon–Sat: 9:00–23:00</div>
            </div>
          </div>
        </div>
      </div>
    </footer>
    <script src="scripts/theme.js" type="module"></script>
  </body>
</html>
